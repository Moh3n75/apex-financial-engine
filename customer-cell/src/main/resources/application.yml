spring:
  application:
    name: customer-cell

  datasource:
    url: ${CELL_DB_URL:jdbc:postgresql://localhost:5434/customer_db}
    username: ${CELL_DB_USERNAME:customer_user}
    password: ${CELL_DB_PASSWORD:local_dev_only}

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/platform

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

apex:
  cell:
    id: ${CELL_ID:customer-cell}

  messaging:
    cell:
      enabled: true
    publisher:
      topic: ${APEX_CUSTOMER_EVENTS_TOPIC:apex.customer.events.v1}
    outbox:
      publisher:
        enabled: true
        interval-ms: 1000
    consumer:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8081}
