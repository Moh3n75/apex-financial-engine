spring:
  grpc:
    server:
      # Preserve HTTP/Kafka-only startup; deployment must explicitly enable secure gRPC.
      enabled: ${apex.grpc.server.enabled:false}
      address: ${CELL_GRPC_ADDRESS:127.0.0.1}
      port: ${CELL_GRPC_PORT:0}
  application:
    name: customer-cell

  datasource:
    url: ${CELL_DB_URL:jdbc:postgresql://localhost:5432/customer_db}
    username: ${CELL_DB_USERNAME:postgres}
    password: ${CELL_DB_PASSWORD:123456789}

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/platform

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

apex:
  cell:
    id: ${CELL_ID:customer-cell}

  messaging:
    cell:
      enabled: true
    publisher:
      topic: ${APEX_CUSTOMER_EVENTS_TOPIC:apex.customer.events.v1}
    outbox:
      publisher:
        enabled: true
        interval-ms: 1000
    consumer:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  # Discovery remains opt-in in these HTTP/Kafka reference cells.
  port: ${SERVER_PORT:8081}

eureka:
  client:
    enabled: ${APEX_EUREKA_ENABLED:false}
