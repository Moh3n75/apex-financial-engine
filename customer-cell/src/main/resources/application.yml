spring:
  application:
    name: customer-cell

  datasource:
    url: ${CELL_DB_URL:jdbc:postgresql://localhost:5434/customer_db}
    username: ${CELL_DB_USERNAME:customer_user}
    password: ${CELL_DB_PASSWORD:local_dev_only}

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8081}
