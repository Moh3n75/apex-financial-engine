spring.application.name=apex-identity-server
server.address=127.0.0.1
server.port=${IDENTITY_PORT:9000}
server.forward-headers-strategy=none
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
spring.datasource.url=${IDENTITY_DB_URL}
spring.datasource.username=${IDENTITY_DB_USER}
spring.datasource.password=${IDENTITY_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.flyway.locations=classpath:db/migration
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.flush-mode=on-save
spring.jpa.open-in-view=false
server.tomcat.accesslog.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.springframework.security=INFO
