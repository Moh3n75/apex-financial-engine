spring:
  application:
    name: reporting-cell

  datasource:
    url: ${CELL_DB_URL:jdbc:postgresql://localhost:5435/reporting_db}
    username: ${CELL_DB_USERNAME:reporting_user}
    password: ${CELL_DB_PASSWORD:local_dev_only}

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/platform

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${APEX_REPORTING_CONSUMER_GROUP:reporting-cell-customer-created-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

apex:
  cell:
    id: ${CELL_ID:reporting-cell}

  messaging:
    cell:
      enabled: true
    publisher:
      topic: ${APEX_CUSTOMER_EVENTS_TOPIC:apex.customer.events.v1}
    outbox:
      publisher:
        enabled: false
    consumer:
      enabled: true
      topics: ${APEX_CUSTOMER_EVENTS_TOPIC:apex.customer.events.v1}
      concurrency: 1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8082}
