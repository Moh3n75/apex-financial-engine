spring:
  grpc:
    server:
      # Preserve HTTP/Kafka-only startup; deployment must explicitly enable secure gRPC.
      enabled: ${apex.grpc.server.enabled:false}
      address: ${CELL_GRPC_ADDRESS:127.0.0.1}
      port: ${CELL_GRPC_PORT:0}
  application:
    name: reporting-cell

  datasource:
    url: ${CELL_DB_URL:jdbc:postgresql://localhost:5432/reporting_db}
    username: ${CELL_DB_USERNAME:postgres}
    password: ${CELL_DB_PASSWORD:123456789}

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/platform

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${APEX_REPORTING_CONSUMER_GROUP:reporting-cell-customer-created-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        allow.auto.create.topics: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

apex:
  cell:
    id: ${CELL_ID:reporting-cell}

  messaging:
    cell:
      enabled: true
    publisher:
      topic: ${APEX_CUSTOMER_EVENTS_TOPIC:apex.customer.events.v1}
    outbox:
      publisher:
        enabled: false
    consumer:
      enabled: true
      topics: ${APEX_CUSTOMER_EVENTS_TOPIC:apex.customer.events.v1}
      concurrency: 1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  # Discovery remains opt-in in these HTTP/Kafka reference cells.
  port: ${SERVER_PORT:8082}

eureka:
  client:
    enabled: ${APEX_EUREKA_ENABLED:false}
