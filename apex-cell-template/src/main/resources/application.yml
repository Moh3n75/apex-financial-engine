spring:
  application:
    name: apex-cell-template

  datasource:
    url: ${CELL_DB_URL:jdbc:postgresql://localhost:5432/apex_cell}
    username: ${CELL_DB_USERNAME:apex}
    password: ${CELL_DB_PASSWORD:apex}

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
