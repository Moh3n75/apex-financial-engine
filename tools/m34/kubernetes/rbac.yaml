apiVersion: v1
kind: Namespace
metadata:
  name: apex-m34
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apex-discovery-reader
  namespace: apex-m34
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apex-discovery-reader
  namespace: apex-m34
rules:
  - apiGroups: [""]
    resources: [services]
    resourceNames: [order-cell, inventory-cell, payment-cell]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apex-discovery-reader
  namespace: apex-m34
subjects:
  - kind: ServiceAccount
    name: apex-discovery-reader
    namespace: apex-m34
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apex-discovery-reader
