spring:
  application:
    name: order-cell
  datasource:
    url: ${CELL_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${CELL_DB_USERNAME:apex}
    password: ${CELL_DB_PASSWORD:apex123}
  flyway:
    locations: classpath:db/migration,classpath:db/platform
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${APEX_ORDER_CONSUMER_GROUP:order-cell-inventory-outcome-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    listener:
      ack-mode: manual_immediate
      auto-startup: true
  grpc:
    server:
      address: ${CELL_GRPC_ADDRESS:127.0.0.1}
      port: ${CELL_GRPC_PORT:0}
      shutdown:
        grace-period: 5s

logging:
  level:
    com.apex.order: DEBUG
    com.apex.platform.messaging: DEBUG
    org.springframework.kafka: INFO

server:
  port: ${SERVER_PORT:0}

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

apex:
  cell:
    id: ${CELL_ID:order-cell}
  grpc:
    server:
      enabled: true
    # For local loopback testing only. Set the environment variable to true explicitly;
    # production requires a trusted PeerIdentityVerifier and mTLS configuration.
    insecure-loopback-test-only: ${APEX_GRPC_INSECURE_LOOPBACK_TEST_ONLY:true}
    test-clients:
      - inventory-cell
      - payment-cell
      - sample-grpc-client
  messaging:
    cell:
      enabled: true
    provisioning:
      enabled: true
      partitions: 1
      replication-factor: -1
      timeout: 10s
    publisher:
      topic: ${APEX_ORDER_EVENTS_TOPIC:apex.order.events.v1}
      routing:
        enabled: true
        required-contracts:
          - ORDER_PLACED:1
          - ORDER_CREATED:1
          - ORDER_READY_FOR_PAYMENT:1
          - ORDER_CANCELLATION_REQUESTED:1
        routes:
          - event-type: ORDER_PLACED
            event-version: 1
            topic: ${APEX_ORDER_EVENTS_TOPIC:apex.order.events.v1}
          - event-type: ORDER_CREATED
            event-version: 1
            topic: apex.order.legacy.events.v1
          - event-type: ORDER_READY_FOR_PAYMENT
            event-version: 1
            topic: apex.order.payment-requests.v1
          - event-type: ORDER_CANCELLATION_REQUESTED
            event-version: 1
            topic: apex.order.inventory-release-requests.v1
    outbox:
      publisher:
        enabled: true
    consumer:
      enabled: true
      # Replay topics are opt-in via this explicit full topic list; NOT subscribed by default.
      topics: ${APEX_ORDER_CONSUMER_TOPICS:apex.inventory.events.v1,apex.payment.events.v1}
      reliability:
        enabled: true