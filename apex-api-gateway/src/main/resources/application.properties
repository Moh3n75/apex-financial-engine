# APEX API Gateway - local development / Eureka discovery
spring.application.name=apex-api-gateway
spring.main.web-application-type=reactive
server.address=127.0.0.1
server.port=8080

# Required by APEX DiscoveryModeGuard (the profile must agree with provider).
# If IntelliJ / the command line already selects an active profile, select eureka there instead.
spring.profiles.active=eureka
apex.discovery.provider=eureka
apex.discovery.registration.enabled=false
apex.discovery.insecure-loopback-test-only=true

# Fetch the registry; Gateway itself is not registered as a Cell.
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=false

# WebFlux Gateway: automatically discover eligible Cell routes.
spring.cloud.gateway.server.webflux.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Fail closed: only trusted instances marked with apex.gateway.expose=true.
# Add eureka.instance.metadata-map.[apex.gateway.expose]=true in the target Cell.
spring.cloud.gateway.server.webflux.discovery.locator.include-expression=metadata['apex.gateway.expose'] == 'true'

# Local, read-only diagnostics (DO NOT expose this actuator publicly).
management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=health,gateway

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=INFO
logging.level.org.springframework.web=ERROR
