spring.application.name=apex-api-gateway
server.address=127.0.0.1
server.port=8080
apex.gateway.mode=disabled
spring.cloud.loadbalancer.retry.enabled=false
spring.cloud.gateway.server.webmvc.forwarded-request-headers-filter.enabled=false
spring.cloud.gateway.server.webmvc.x-forwarded-request-headers-filter.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,discoveredTargets
