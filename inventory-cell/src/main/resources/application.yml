spring:
  application:
    name: inventory-cell
  datasource:
    url: ${CELL_DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${CELL_DB_USERNAME:apex}
    password: ${CELL_DB_PASSWORD:apex123}
  flyway:
    locations: classpath:db/migration,classpath:db/platform
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${APEX_INVENTORY_CONSUMER_GROUP:inventory-cell-order-placed-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    listener:
      ack-mode: manual_immediate
      auto-startup: true
  grpc:
    server:
      address: ${CELL_GRPC_ADDRESS:127.0.0.1}
      port: ${CELL_GRPC_PORT:0}
      shutdown:
        grace-period: 5s

server:
  port: ${SERVER_PORT:0}

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

apex:
  cell:
    id: inventory-cell
  grpc:
    server:
      enabled: true
    # Local-only test mode; false by default. Production requires mTLS/PeerIdentityVerifier.
    insecure-loopback-test-only: ${APEX_GRPC_INSECURE_LOOPBACK_TEST_ONLY:true}
    test-clients:
      - order-cell
      - payment-cell
      - sample-grpc-client
  messaging:
    provisioning:
      enabled: true
      partitions: 1
      replication-factor: -1
      timeout: 10s
    cell:
      enabled: true
    consumer:
      enabled: true
      # Normal three-Cell Saga subscriptions. To include replay streams,
      # override the complete comma-separated list via APEX_INVENTORY_CONSUMER_TOPICS.
      topics: ${APEX_INVENTORY_CONSUMER_TOPICS:apex.order.events.v1,apex.order.inventory-release-requests.v1}
      reliability:
        enabled: true
    publisher:
      topic: ${APEX_INVENTORY_EVENTS_TOPIC:apex.inventory.events.v1}
    outbox:
      publisher:
        enabled: true
