# Independent APEX Operations Cell
spring.application.name=apex-operations-console
apex.cell.id=${spring.application.name}
server.port=${SERVER_PORT:9190}
server.address=127.0.0.1
eureka.instance.prefer-ip-address=true

# Shared APEX servlet execution context
apex.webmvc.context.enabled=true
apex.ops.m36a.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Keep pre-existing console security and resource limits
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.threads.max=8
server.tomcat.threads.min-spare=1
server.tomcat.max-connections=32
server.tomcat.accept-count=8
server.max-http-request-header-size=8KB
