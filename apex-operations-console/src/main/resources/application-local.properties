# Explicit local-development inventory only. No changes to OAuth/mTLS/security configuration.
apex.ops.local-inventory.enabled=true
apex.ops.local-inventory.environment=local
apex.ops.local-inventory.max-stale-ms=60000
# Faster local cache convergence. Eureka server response caching/lease eviction may add delay.
eureka.client.registry-fetch-interval-seconds=5
apex.ops.local-inventory.include-instances=true
# Server-only read of the existing, read-only Gateway Actuator endpoint.
apex.ops.gateway-routes.enabled=true
apex.ops.gateway-routes.origin=http://127.0.0.1:8080
apex.ops.gateway-routes.service=apex-api-gateway
# Opt in only with an explicit logical Kafka cluster shared by the advertising Cells.
apex.ops.local-contracts.enabled=${APEX_OPS_LOCAL_CONTRACTS_ENABLED:false}
apex.ops.local-contracts.cluster=${APEX_KAFKA_LOGICAL_CLUSTER:unknown}
