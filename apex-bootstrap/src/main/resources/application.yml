spring:
  application:
    name: apex-bootstrap

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456789


  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29392

    producer:
      key-serializer:
        org.apache.kafka.common.serialization.StringSerializer

      value-serializer:
        org.apache.kafka.common.serialization.StringSerializer

      acks: all

      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5


logging:
  level:
    org.flywaydb: DEBUG