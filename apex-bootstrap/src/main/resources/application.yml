spring:
  application:
    name: apex-bootstrap

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456789


  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092

    producer:
      key-serializer:
        org.apache.kafka.common.serialization.StringSerializer

      value-serializer:
        org.apache.kafka.common.serialization.StringSerializer


      acks: all

      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        compression.type: zstd
        batch.size: 65536
        linger.ms: 10
        retries: 2147483647


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - prometheus


logging:
  level:
    org.flywaydb: DEBUG